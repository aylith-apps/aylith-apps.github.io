name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Fired by each product repo's notify-catalog.yml on push to its default branch.
  repository_dispatch:
    types: [catalog-refresh]
  # Safety net for brand-new / not-yet-adopted repos.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The cron and repository_dispatch triggers below never touch a pull request, so a
  # push/PR-only workflow would not stand between a broken commit and the live site.
  # Deploy therefore runs the gate itself and refuses to publish a red build.
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - name: Collect catalog from org repos
        env:
          # Prefer a dedicated org-wide token (needed for private repos / higher
          # rate limits); fall back to the workflow's default token, which can
          # read public repos out of the box.
          CATALOG_GITHUB_TOKEN: ${{ secrets.CATALOG_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # On failure, fall through to the committed snapshot rather than blocking
        # the deploy — collect.mjs swaps .generated in atomically, so a failed run
        # leaves no partial output.
        run: npm run collect || echo "::warning::Catalog collection failed — building from the committed snapshot."
      - run: npm run build
      # Blocking in `verify`, where the content is this repo's own snapshot. Here the pages are
      # built from manifests collected out of other repos, and a relative link in somebody else's
      # manifest body must not be able to hold the whole site's deploy hostage.
      - name: Check links in the collected build
        run: npm run check:links || echo "::warning::Broken internal link in the collected build — see the log."
      - uses: actions/upload-pages-artifact@v5
        with:
          path: landing/build

  deploy:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
